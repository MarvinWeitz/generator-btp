trigger:
  branches:
    include:
      - main
      # - development
  # paths:
  #   include:
  #     - your-include/path
  #   exclude:
  #     - your-exclude/path

pool:
  vmImage: 'ubuntu-latest'

resources:
  repositories:
    - repository: <%= pipelineAlias %>
      type: git
      name: <%= pipelineRepository %>

steps:
  - template: cap-pipeline.yml@<%= pipelineAlias %>
    parameters:
      deployment_content: |
        gen.zip
        mta.yaml
        xs-security.json
        dist/**
        mta-ext/**
        .cdsrc.json
        resources/**

  # Add custom steps here
